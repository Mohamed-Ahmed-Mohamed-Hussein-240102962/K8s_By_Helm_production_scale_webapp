configmaps:
  appConfigName: app-config
  nginxConfigName: nginx-config

app:
  name: "Library API"
  env: "production"
  debug: "false"
  url: "https://laravel.lib:32140"

database:
  connection: "mysql"
  port: "3306"
  name: "laravel"

nginx:
  serverName: "laravel.lib"
  backendService: "laravel-backend-service"

rbac:
  serviceAccountName: laravel-sa
  roleName: laravel-role
  roleBindingName: laravel-rolebinding

storageClass:
  name: local-storage
  provisioner: rancher.io/local-path
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer 

mysqlHeadless:
  name: mysql-headless
  labelApp: mysql
  port: 3306
  targetPort: 3306
  portName: mysql

mysql:
  name: mysql
  replicaCount: 1
  image:
    repository: mysql
    tag: "8.0"
  persistence:
    size: 2Gi
  pv:
    namePrefix: local-pv
    basePath: /mnt/data


frontend:
  name: nginx-frontend
  replicaCount: 3
  image: "nginx:alpine"
  containerPort: 80
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"