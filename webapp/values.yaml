backend:
  name: laravel-backend
  replicaCount: 4
  image: "moopsdev/my-laravel-app:latest"
  containerPort: 9000
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
backendService:
  name: laravel-backend-service
  type:  ClusterIP
  port: 80
  targetPort: 9000

backendhpa:
  name: laravel-backend-hpa
  minReplicas: 2
  maxReplicas: 6 
  averageUtilization: 70


